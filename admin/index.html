<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Perfume · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#542d43"><link rel="stylesheet" href="/admin/admin.css"></head><body>
<div id="loginScreen" class="login-wrap"><form class="login" id="loginForm"><h1>ENGLISH PERFUME</h1><p>Sign in to manage your store.</p><div class="field"><label>Admin username</label><input id="username" value="admin" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Sign in</button></form></div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">ENGLISH<small>ADMIN PANEL</small></div><nav class="nav"><button data-page="overview" class="active"><span class="ico">◈</span>Overview</button><button data-page="orders"><span class="ico">▣</span>Orders</button><button data-page="products"><span class="ico">◆</span>Products</button></nav><div class="sidebar-bottom"><b>English Perfume</b><br><span>Live store management</span></div></aside><main class="main"><header class="topbar"><h1 id="pageTitle">Overview</h1><div class="top-actions"><button class="btn" id="exportBtn">Export orders CSV</button><button class="btn" id="pwBtn">Change password</button><button class="btn primary" id="logoutBtn">Sign out</button></div></header><div class="content" id="content"></div></main></div>
<div class="modal-back" id="modalBack"><div class="modal"><h2 id="modalTitle">Add product</h2><form id="productForm"><div class="form-grid"><div class="field full"><label>Product name *</label><input name="name" required maxlength="120"></div><div class="field"><label>Price (RM) *</label><input name="price" type="number" min="0" step="1" required></div><div class="field"><label>Compare-at price (RM)</label><input name="was" type="number" min="0" step="1" value="0"></div><div class="field"><label>Stock quantity</label><input name="stock" type="number" min="0" step="1" value="0"></div><div class="field"><label>Category</label><select name="cat"><option value="men">Men</option><option value="women">Women</option><option value="unisex">Unisex</option></select></div><div class="field"><label>SKU</label><input name="sku" maxlength="40"></div><div class="field full"><label>Short description / scent notes</label><textarea name="label" maxlength="100"></textarea></div><div class="field full"><label>Product image (upload)</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp"><small id="imageHint">Optional image. Max 5 MB.</small></div><div class="field"><label>Visibility</label><select name="active"><option value="true">Published</option><option value="false">Hidden</option></select></div></div><div class="modal-foot"><button type="button" class="btn" id="cancelProduct">Cancel</button><button class="btn primary" type="submit">Save product</button></div></form></div></div><div id="toast" class="toast"></div>
<script src="/admin/admin.js"></script></body></html>
